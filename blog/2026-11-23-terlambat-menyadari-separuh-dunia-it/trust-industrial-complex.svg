<text x="48" y="220" font-size="14" font-weight="400" fill="#94a3b8">(komodifikasi ketidakpastian)</text>
<rect x="890" y="122" width="280" height="112" rx="12" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 5"/>
