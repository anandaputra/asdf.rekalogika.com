    <rect x="940" y="526" width="13" height="34" fill="#c084fc"/>
    <text x="1052" y="548" text-anchor="middle" fill="#e2e8f0">UU PDP</text>
    <rect x="950" y="492" width="192" height="34" rx="5" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="950" y="492" width="13" height="34" fill="#ff6c52"/>
    <text x="1052" y="514" text-anchor="middle" fill="#e2e8f0">ISO 27001</text>
    <rect x="964" y="458" width="170" height="34" rx="5" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="964" y="458" width="13" height="34" fill="#60a5fa"/>
    <text x="1056" y="480" text-anchor="middle" fill="#e2e8f0">COBIT</text>
    <rect x="954" y="424" width="186" height="34" rx="5" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="954" y="424" width="13" height="34" fill="#fbbf24"/>
    <text x="1054" y="446" text-anchor="middle" fill="#e2e8f0">DMBOK</text>
    <rect x="974" y="390" width="152" height="34" rx="5" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="974" y="390" width="13" height="34" fill="#a3e635"/>
    <text x="1056" y="412" text-anchor="middle" fill="#e2e8f0">SOP</text>
  </g>

