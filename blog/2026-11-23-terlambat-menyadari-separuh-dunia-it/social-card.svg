<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter">
  <!-- Sumber untuk social-card.png. Buat ulang dengan:
       rsvg-convert -w 1200 -h 630 social-card.svg -o social-card.png -->
  <defs>
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0f172a"/>
  <ellipse cx="900" cy="330" rx="330" ry="300" fill="url(#spot)"/>
  <rect y="606" width="1200" height="24" fill="#ff6c52"/>

  <!-- Teks -->
  <text x="72" y="110" font-size="18" font-weight="700" fill="#ff6c52" letter-spacing="3">KRITIK DIRI · TATA KELOLA IT</text>
  <text x="68" y="192" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-2">Terlambat</text>
  <text x="68" y="262" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-2">Menyadari</text>
  <text x="68" y="332" font-size="64" font-weight="800" fill="#ff6c52" letter-spacing="-2">Separuh Dunia IT</text>
  <text x="72" y="420" font-size="25" fill="#cbd5e1">Yang memegang cambuk,</text>
  <text x="72" y="454" font-size="25" fill="#cbd5e1">bukan yang memegang mesin.</text>
  <text x="72" y="552" font-size="24" font-weight="600" fill="#60a5fa">asdf.rekalogika.com</text>

  <!-- Tanah -->
  <line x1="630" y1="560" x2="1180" y2="560" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Tumpukan binder: panggung sang manajer -->
