    <circle cx="880" cy="347" r="4" fill="#22c55e"/><circle cx="892" cy="347" r="4" fill="#22c55e"/>
    <circle cx="880" cy="368" r="4" fill="#60a5fa"/><circle cx="892" cy="368" r="4" fill="#fbbf24"/>
    <circle cx="880" cy="389" r="4" fill="#22c55e"/><circle cx="892" cy="389" r="4" fill="#ef4444"/>
  </g>

  <!-- Bunyi cambuk -->
  <polygon points="790,286 797,302 814,296 805,311 822,320 803,324 808,341 793,331 782,345 780,327 763,325 777,315 768,300 784,305" fill="#fbbf24"/>
  <text x="826" y="300" font-size="30" font-weight="900" fill="#fbbf24" transform="rotate(-8 826 300)">CTARR!</text>

  <!-- Engineer 1 -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <polyline points="722,470 706,512 690,558" fill="none" stroke="#475569" stroke-width="16"/>
    <polyline points="722,470 746,514 760,558" fill="none" stroke="#475569" stroke-width="16"/>
    <line x1="722" y1="468" x2="690" y2="412" stroke="#3b82f6" stroke-width="30"/>
    <polyline points="688,418 672,456 678,484" fill="none" stroke="#3b82f6" stroke-width="12"/>
    <circle cx="662" cy="428" r="20" fill="#f1d5b8"/>
    <path d="M 650 418 Q 660 404 678 414" stroke="#1e293b" stroke-width="7" fill="none"/>
    <path d="M 640 402 q -6 9 0 13 q 6 -4 0 -13 Z" fill="#93c5fd"/>
    <path d="M 632 420 q -5 8 0 11 q 5 -3 0 -11 Z" fill="#93c5fd"/>
  </g>

  <!-- Engineer 2 -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <polyline points="872,470 856,512 840,558" fill="none" stroke="#475569" stroke-width="16"/>
    <polyline points="872,470 896,514 910,558" fill="none" stroke="#475569" stroke-width="16"/>
    <line x1="872" y1="468" x2="840" y2="412" stroke="#3b82f6" stroke-width="30"/>
    <polyline points="838,418 822,456 828,484" fill="none" stroke="#3b82f6" stroke-width="12"/>
    <circle cx="812" cy="428" r="20" fill="#f1d5b8"/>
    <path d="M 800 418 Q 810 404 828 414" stroke="#1e293b" stroke-width="7" fill="none"/>
    <path d="M 790 404 q -6 9 0 13 q 6 -4 0 -13 Z" fill="#93c5fd"/>
  </g>
</svg>
