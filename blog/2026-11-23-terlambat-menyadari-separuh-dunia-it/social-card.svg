    <!-- kaki -->
    <line x1="1037" y1="390" x2="1040" y2="325" stroke="#475569" stroke-width="18"/>
    <line x1="1067" y1="390" x2="1062" y2="325" stroke="#475569" stroke-width="18"/>
    <ellipse cx="1031" cy="389" rx="15" ry="6" fill="#020617"/>
    <ellipse cx="1073" cy="389" rx="15" ry="6" fill="#020617"/>
    <!-- lengan kiri memegang checklist -->
    <polyline points="1086,262 1100,300 1092,318" fill="none" stroke="#64748b" stroke-width="15"/>
    <!-- jas -->
    <path d="M 1012 250 Q 1050 238 1090 250 L 1084 334 L 1018 334 Z" fill="#64748b"/>
    <path d="M 1036 250 L 1064 250 L 1050 292 Z" fill="#f8fafc"/>
    <path d="M 1046 255 L 1054 255 L 1058 290 L 1050 300 L 1042 290 Z" fill="#dc2626"/>
    <path d="M 1036 250 L 1046 286 M 1064 250 L 1054 286" stroke="#475569" stroke-width="3" fill="none"/>
    <!-- lengan kanan terangkat -->
    <polyline points="1016,262 986,228 966,188" fill="none" stroke="#64748b" stroke-width="15"/>
    <circle cx="964" cy="184" r="9" fill="#f1d5b8"/>
    <!-- kepala -->
    <circle cx="1050" cy="220" r="25" fill="#f1d5b8"/>
    <path d="M 1025 216 Q 1028 190 1052 192 Q 1076 192 1076 214 Q 1062 202 1040 205 Q 1030 207 1025 216 Z" fill="#1e293b"/>
    <line x1="1033" y1="214" x2="1046" y2="219" stroke="#1e293b" stroke-width="3"/>
    <line x1="1033" y1="224" x2="1044" y2="224" stroke="#1e293b" stroke-width="4"/>
    <path d="M 1034 236 Q 1042 232 1050 236" stroke="#1e293b" stroke-width="3" fill="none"/>
    <!-- papan checklist -->
    <g transform="rotate(8 1112 318)">
      <rect x="1090" y="290" width="44" height="56" rx="4" fill="#f8fafc"/>
      <rect x="1104" y="285" width="16" height="8" rx="2" fill="#94a3b8"/>
      <path d="M 1096 306 l 4 4 l 7 -8 M 1096 320 l 4 4 l 7 -8 M 1096 334 l 4 4 l 7 -8" stroke="#16a34a" stroke-width="2.5" fill="none"/>
      <path d="M 1112 306 h 16 M 1112 320 h 16 M 1112 334 h 16" stroke="#94a3b8" stroke-width="2.5"/>
    </g>
    <circle cx="1096" cy="316" r="8" fill="#f1d5b8"/>
  </g>

  <!-- Cambuk -->
  <line x1="966" y1="186" x2="944" y2="160" stroke="#78350f" stroke-width="9" stroke-linecap="round"/>
  <path d="M 944 160 C 870 60, 730 90, 722 190 S 752 290, 782 312" fill="none" stroke="#ff6c52" stroke-width="5" stroke-linecap="round"/>
  <path d="M 700 120 q -10 25 0 50 M 686 140 q -6 15 0 30" stroke="#ff6c52" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

